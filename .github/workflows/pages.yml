name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per ref, so PR runs and main runs never cancel each other; a main run (which deploys) is never cut off.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Types (tests and e2e included), dead code (Knip), duplication (jscpd, max 2%), lint + format (Biome).
      - run: bun run quality
      - run: bun run build
      - run: bun run bridge:build
      - name: Smoke-start the built bridge
        run: |
          export YURT_HOME="$(mktemp -d)"
          node packages/bridge/dist/cli.js --no-open --port 7799 &
          pid=$!
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:7799/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:7799/ | grep -q __YURT_ADMIN__
          kill -INT "$pid"
          wait "$pid"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  # One job per package, side by side: the run takes as long as the slowest suite, not their sum.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['@yurt/protocol', yurt-bridge, '@yurt/web']
    steps:
      - uses: actions/checkout@v4
      # Component and app tests run in real Chromium (Vitest browser mode); the protocol suite is Node only.
      - uses: ./.github/actions/setup
        with:
          chromium: ${{ matrix.package != '@yurt/protocol' }}
      # Unit + integration tests with coverage thresholds (the bridge suite also builds and starts dist/cli.js).
      - run: bun run --filter '${{ matrix.package }}' test

  # Not gated on build: it builds the app itself, so it starts right away.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true   # relies on public Nostr relays; don't block deploys on relay weather
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          chromium: true
      - run: bun run e2e

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
