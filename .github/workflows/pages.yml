name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per ref, so PR runs and main runs never cancel each other; a main run (which deploys) is never cut off.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Types (tests and e2e included), dead code (Knip), duplication (jscpd, max 2%), lint + format (Biome).
      - run: bun run quality
      - run: bun run build
      - run: bun run bridge:build
      - name: Smoke-start the built bridge
        run: |
          export YURT_HOME="$(mktemp -d)"
          node packages/bridge/dist/cli.js --no-open --port 7799 &
          pid=$!
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:7799/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:7799/ | grep -q __YURT_ADMIN__
          kill -INT "$pid"
          wait "$pid"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  # Side by side: the run takes as long as the slowest job, not the sum. The web suite (one file at a time: its files
  # share a browser origin) is split across three machines, each with its own browser.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: protocol, run: bun run --filter @yurt/protocol test, chromium: false }
          - { name: bridge, run: bun run --filter yurt-bridge test, chromium: true }
          - { name: web 1/3, run: cd apps/web && bun run test:shard 1/3, chromium: true, blob: true }
          - { name: web 2/3, run: cd apps/web && bun run test:shard 2/3, chromium: true, blob: true }
          - { name: web 3/3, run: cd apps/web && bun run test:shard 3/3, chromium: true, blob: true }
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      # Component and app tests run in real Chromium (Vitest browser mode); the protocol suite is Node only.
      - uses: ./.github/actions/setup
        with:
          chromium: ${{ matrix.chromium }}
      # Unit + integration tests with coverage thresholds (the bridge suite also builds and starts dist/cli.js).
      - run: ${{ matrix.run }}
      - if: matrix.blob
        uses: actions/upload-artifact@v4
        with:
          name: web-blob-${{ strategy.job-index }}
          path: apps/web/.vitest/blob
          include-hidden-files: true
          retention-days: 1

  # The web shards' results and coverage in one report: the coverage thresholds apply here.
  web-coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: web-blob-*
          path: apps/web/.vitest/blob
          merge-multiple: true
      - run: cd apps/web && bun run test:merge

  # Not gated on build: it builds the app itself, so it starts right away.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true   # relies on public Nostr relays; don't block deploys on relay weather
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          chromium: true
      - run: bun run e2e

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, test, web-coverage]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
